[project]
name = "tenun128"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
